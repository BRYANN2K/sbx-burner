# syntax=docker/sandbox-kit:3
# OpenCode as a mixin, for workloads that are not Docker's built-in opencode
# agent (the Kali, REMnux and Ubuntu bases in this directory).
# The credentials and first-start files follow the kit spec; burner's own
# text and scripts, for the two providers burner runs: OpenAI (key or
# ChatGPT OAuth) and Anthropic (key only: sbx does not hand Anthropic OAuth
# to OpenCode, so anthropic/* models need a stored key). Hostnames,
# sentinel values and OpenCode's auth file shape are facts of the protocol.
schemaVersion: "3"
kind: mixin
displayName: OpenCode (sbx-burner)
description: OpenCode CLI with proxy-managed OpenAI and Anthropic credentials.
sourceUrl: https://github.com/BRYANN2K/sbx-burner

args:
  version:
    default: "2.3.2"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENCODE_VERSION

provides: ["opencode@${{ kit.args.version }}"]

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com:443
          - openai.com:443
          - auth.openai.com:443
          - chatgpt.com:443
          - api.anthropic.com:443
          - claude.ai:443
          - console.anthropic.com:443
  - type: com.docker.sandbox/credential@1
    optional: true
    description: OpenAI credential held by the sbx proxy (key or ChatGPT OAuth)
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
          - {domain: openai.com, header: Authorization, format: "Bearer %s"}
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        resourceHosts: [chatgpt.com]
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed
        # sbx renders OpenCode's auth file with placeholder tokens; the proxy
        # puts the real token on the wire.
        credentialFile:
          path: ~/.local/share/opencode/auth.json
          structure:
            openai:
              type: oauth
              access: "{{.AccessToken}}"
              refresh: "{{.RefreshToken}}"
              expires: "{{.ExpiresAt}}"
  - type: com.docker.sandbox/credential@1
    optional: true
    description: Anthropic key held by the sbx proxy
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: claude.ai, header: x-api-key, format: "%s"}
          - {domain: console.anthropic.com, header: x-api-key, format: "%s"}
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Create the folders as root first, so nothing later creates them
        # root-owned.
        - command: |
            install -d -o agent -g agent /home/agent/.config /home/agent/.config/opencode \
              /home/agent/.local /home/agent/.local/share /home/agent/.local/share/opencode
          user: "0"
          description: Create OpenCode's config and data folders for the agent user
      startup:
        # When sbx publishes an MCP gateway, add it to opencode.json and keep
        # everything else in the file.
        - command: |
            set -eu
            [ -n "${MCP_GATEWAY_URL:-}" ] || exit 0
            conf="$HOME/.config/opencode/opencode.json"
            mkdir -p "$(dirname "$conf")"
            [ -s "$conf" ] || printf '{}\n' > "$conf"
            jq --arg url "$MCP_GATEWAY_URL" --arg token "Bearer $MCP_SENTINEL_TOKEN_NAME" \
              '. + {"$schema": "https://opencode.ai/config.json"}
               | .mcp = ((.mcp // {}) + {"mcp-gateway": {type: "remote", url: $url, enabled: true, headers: {Authorization: $token}}})' \
              "$conf" > "$conf.new"
            mv "$conf.new" "$conf"
          user: agent
          env: [MCP_GATEWAY_URL, MCP_SENTINEL_TOKEN_NAME]
          description: Add the sandbox MCP gateway to opencode.json
      files:
        - path: /home/agent/.config/opencode/opencode.json
          content: '{"$schema": "https://opencode.ai/config.json"}'
          overwrite: false
          description: Start opencode.json with its schema only

dockerfile: agent-opencode.dockerfile
