# syntax=docker/sandbox-kit:3
# Ubuntu 24.04 LTS as a sandbox workload.
# ubuntu:24.04 does not meet the sbx kit platform floor on its own (bash, curl,
# git, a CA store and a non-root `agent` user with uid 1000 and home
# /home/agent). The companion Dockerfile adds exactly that and nothing else.
# The agent CLI is layered on top with kits/agent-claude or kits/agent-codex.
# TODO(verify): not built or run yet; needs sbx >= 0.45 and Docker Buildx.
schemaVersion: "3"
kind: workload
displayName: Ubuntu 24.04 LTS (sbx-burner)
description: Ubuntu 24.04 LTS base with the sbx platform floor, for lab recipes.
sourceUrl: https://github.com/BRYANN2K/sbx-burner

capabilities:
  - type: com.docker.sandbox/sbx@1
# No run-time network grant: package mirrors are not opened to the agent.
# Recipes that apt-install list their mirrors in run.network.install_allow,
# which the runner opens for the tools step only.
# TODO(verify): whether the kit spec has a build-only network phase.

dockerfile: base-ubuntu.dockerfile
