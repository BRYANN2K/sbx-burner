schema_version: "1"
name: __NAME__
category: __CATEGORY__
# required | optional | none. Security recipes must use "required".
scope: none

variants:
  linux:
    status: beta
    # Mixin kit(s) added to the workload, relative to the repository root.
    kit: kits/lab-tools
    # Base image family. debian:stable-slim = Docker's built-in Debian agent
    # kit. For another base, add `workload: kits/base-<name>`.
    image: debian:stable-slim
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 15
  # required | optional | none: whether SOME target is needed at all.
  # Security recipes that audit the user's system use required.
  target: optional
  # Accepted target kinds: path (dir mounted read-only at /home/agent/target),
  # repo (cloned on the host, mounted like path), app (a project started in
  # the sandbox at localhost:PORT), image (host docker save/pull or a
  # tarball), port (the image run as an app on localhost), url (a remote app,
  # needs a scope), demo (a bundled lab target via run.demo). port requires
  # image; demo requires run.demo.
  targets: [path]
  # demo: fixtures/demo.sh    # starts a bundled demo target inside the
                             # sandbox; runs only with --demo. Its image pull
                             # hosts go in network.install_allow below.
  # target_health: /          # HTTP path polled after --target-port starts
                             # the user's container (default "/").
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene]
  network:
    # Hosts that only tools/install.sh needs (release downloads, apt, PyPI).
    # The runner opens them for the tools step and closes them before the
    # agent starts.
    install_allow:
      - github.com:443
      - release-assets.githubusercontent.com:443
    # Hosts the agent itself needs at run time. The agent API host and the
    # scope hosts are added by the runner.
    allow: []
