recipe: devsecops/sast-semgrep
must_find:
  - id_hint: express-sqli
    where: {tool: semgrep, location: ".*node/app\\.js.*", cwe: "CWE-89"}
    class: sql-injection
  - id_hint: express-ssrf
    where: {tool: semgrep, location: ".*node/app\\.js.*", cwe: "CWE-918"}
    class: ssrf
  - id_hint: flask-sqli-or-traversal
    where: {tool: semgrep, location: ".*python/api\\.py.*", cwe: "CWE-89|CWE-22"}
    class: injection-or-traversal
must_not_find:
  - where: {location: ".*(files\\.js|export\\.py).*"}
    reason: parameterized query / allowlist look-alikes, not flaws
min_findings: 3
max_findings: 10
