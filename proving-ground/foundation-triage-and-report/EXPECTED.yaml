recipe: foundation/triage-and-report
must_find:
  # Proven: the true/false pair shows other customers' rows.
  - id_hint: pg-parcel-search-sqli
    class: sql-injection
    where: {cwe: "CWE-89.*", location: ".*search.*"}
  # Proven: the response is the server's passwd file.
  - id_hint: pg-label-traversal
    class: path-traversal
    where: {cwe: "CWE-(22|23|35).*", location: ".*labels.*"}
  # Proven: one session reads another customer's parcel (control included).
  - id_hint: pg-parcel-idor
    class: broken-access-control
    where: {cwe: "CWE-(639|284|285|862|863|932).*", location: ".*parcels/\\{?id\\}?.*"}
artifacts:
  - id_hint: pg-every-candidate-triaged
    path: artifacts/triage.jsonl
    contains: "(?s)(?=.*CAND-001)(?=.*CAND-002)(?=.*CAND-003)(?=.*CAND-004)(?=.*CAND-005).*"
  # CAND-001 claims 8.8; its vector recomputes to 6.5.
  - id_hint: pg-cvss-recomputed
    path: artifacts/cvss-check.txt
    contains: "6\\.5"
must_not_find:
  # Unproven: no request or response was captured.
  - where: {location: ".*webhooks.*"}
    reason: SSRF claim without any proof artifact
  - where: {cwe: "CWE-918.*"}
    reason: SSRF claim without any proof artifact
  # Unproven: the captured response shows the payload HTML-escaped.
  - where: {location: ".*track.*"}
    reason: reflected input is escaped in the proof, no impact shown
  - where: {cwe: "CWE-79.*"}
    reason: reflected input is escaped in the proof, no impact shown
min_findings: 3
max_findings: 3
