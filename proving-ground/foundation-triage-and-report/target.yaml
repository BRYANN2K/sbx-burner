recipe: foundation/triage-and-report
summary: >-
  Candidate bundle for a parcel-tracking service: five scanner and manual
  candidates with their proof files, built into .build/ so the session tokens
  in one transcript are random per build.
build: build.sh
runs:
  - kind: path
    args: ["--target", "proving-ground/.build/foundation-triage-and-report/bundle"]
scope: scope.yaml
cost: small
