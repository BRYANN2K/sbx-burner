recipe: training/ctf-solver
must_find:
  # The seed space is 32 bits and the note's first bytes are known: recover
  # the LCG state, decrypt, check the flag.
  - id_hint: pg-night-shift
    class: weak-prng-stream-cipher
    where: {rule: "crypto", target: ".*night-shift.*"}
  # A zip appended after IEND holds the real note.
  - id_hint: pg-field-photo
    class: data-appended-to-file
    where: {rule: "forensics", target: ".*field-photo.*"}
artifacts:
  - id_hint: pg-night-shift-checked
    path: artifacts/night-shift-check.txt
    contains: "(?m)^OK night-shift$"
  - id_hint: pg-field-photo-checked
    path: artifacts/field-photo-check.txt
    contains: "(?m)^OK field-photo$"
must_not_find:
  - where: {location: "(?i)(png )?(text|t[Ee]Xt|comment).*"}
    reason: the flag-shaped value in the tEXt Comment chunk is not the flag; check.sh answers WRONG
min_findings: 2
max_findings: 2
