recipe: devsecops/fuzzing
must_find:
  # ASan: stack-buffer-overflow in apply_record (cfg.c), reached by an 'N'
  # record longer than 32 bytes. One crash site, so one finding.
  - id_hint: pg-cfg-name-overflow
    class: stack-buffer-overflow
    where: {rule: ".*stack-buffer-overflow.*", location: ".*cfg\\.c:\\d+.*"}
artifacts:
  - id_hint: pg-crash-reproducer
    path: "artifacts/crash-*"
  - id_hint: pg-asan-stack
    path: "artifacts/*-stack.txt"
    contains: "stack-buffer-overflow"
must_not_find:
  - where: {location: ".*note\\.c.*"}
    reason: cfg_set_note checks the length before copying
  - where: {cwe: "CWE-134.*"}
    reason: clang's -Wformat-security warning on cfg_report; the format comes from a constant table
min_findings: 1
max_findings: 1
