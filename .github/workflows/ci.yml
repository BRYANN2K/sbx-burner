name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff + pytest (py${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --quiet "pytest>=8" "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  recipes:
    name: recipe-lint + evals + index
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib only: no install step on purpose.
      - name: recipe-lint
        run: python -m lab lint
      - name: recipe evals (golden fixtures)
        run: python -m lab eval
      - name: gen_index check
        run: python scripts/gen_index.py --check
      - name: every recipe prints a plan
        run: |
          set -euo pipefail
          # Dry-run planning refuses a mixin workload whose credential binding
          # is not approved. CI stores no secrets, so plan against a throwaway
          # credentials.yaml generated from the kits' credential@1 needs;
          # real runs still refuse until a human runs `burner approve`.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_CONFIG_HOME/sbx"
          python - <<'PY'
          import os
          from pathlib import Path
          from lab import sbx

          needs = sbx.kits_binding_needs(Path("kits"))
          out = Path(os.environ["XDG_CONFIG_HOME"]) / "sbx" / "credentials.yaml"
          out.write_text(sbx.binding_snippet(needs) + "\n")
          PY
          python -m lab list | awk '$2 != "planned" {print $1}' | while read -r recipe; do
            scope="recipes/${recipe}/scope.example.yaml"
            args=(--dry-run)
            if [ -f "$scope" ]; then
              from="$(date -u +%F)"
              to="$(date -u -d '+7 days' +%F)"
              sed -e "s/not_before: .*/not_before: \"${from}\"/" -e "s/not_after: .*/not_after: \"${to}\"/" "$scope" > /tmp/scope.yaml
              args+=(--scope /tmp/scope.yaml)
            fi
            scope_arg=()
            if [ -f "$scope" ]; then scope_arg=(/tmp/scope.yaml); fi
            read -r -a target_args <<< "$(python scripts/ci_dry_args.py "recipes/${recipe}" "${scope_arg[@]}")"
            args+=("${target_args[@]}")
            python -m lab run "$recipe" "${args[@]}" > /dev/null
            echo "ok ${recipe}"
          done

  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -gt 0 ]; then shellcheck -x "${files[@]}"; fi

  yaml:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet "yamllint==1.35.1"
      - run: yamllint -c scripts/yamllint.yml .

  proving-ground:
    name: proving-ground (dry run)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Validates every target.yaml/EXPECTED.yaml and plans each run through
      # `python3 -m lab run --dry-run`. A folder is skipped only when its
      # recipe directory is absent (recipe PR not merged yet); a folder whose
      # recipe exists must validate and plan, or the job fails.
      - run: python proving-ground/run.py
