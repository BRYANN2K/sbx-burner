# Stock Docker Sandboxes environment file for the Linux variant.
# Use it without the lab runner:  sbx env run recipes/foundation/triage-and-report
# The runner (python -m lab run) adds scope enforcement, evidence and reports.
# `sbx env` is experimental in sbx; the format may change.
schemaVersion: "1"
name: lab-triage-and-report
agent: claude
workspace: .
kits:
  - ../../../kits/lab-tools
sandboxOptions:
  skills: "off"
