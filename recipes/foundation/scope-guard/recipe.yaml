schema_version: "1"
name: scope-guard
category: foundation
scope: required

variants:
  linux:
    status: beta
    kit: kits/lab-tools
    image: debian:stable-slim
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 15
  target: none
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene, scope-discipline]
  network:
    # Nothing is open while the agent runs: this recipe exists to prove
    # egress is closed. The canaries are deliberately NOT listed: they must
    # stay blocked.
    allow: []
    # Debian packages, only when curl, jq or python3 are missing. Opened
    # for the tools step, closed before the agent starts.
    install_allow:
      - deb.debian.org:80
      - security.debian.org:80
    # In strict scope mode the runner also fails the run when one of these
    # answers, so a leaking policy aborts before the agent even starts.
    probe_denied:
      - example.com
      - example.org
