schema_version: "1"
name: sast-semgrep
category: devsecops
scope: none

variants:
  linux:
    status: beta
    kit: kits/devsecops
    image: debian:stable-slim
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 20
  target: required
  # path: a local folder, mounted read-only at /home/agent/target.
  # repo: a git repository cloned on the host with the user's own git login
  # (full history kept, .git/config scrubbed), then mounted like a path.
  targets: [path, repo]
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene]
  network:
    # Nothing is open while the agent runs: the bundled rules are enough.
    allow: []
    # PyPI for the pinned semgrep install, Debian apt for pipx/jq; opened
    # for the tools step, closed before the agent starts.
    install_allow:
      - pypi.org:443
      - files.pythonhosted.org:443
      - deb.debian.org:80
      - security.debian.org:80
    # semgrep.dev is NOT in either list: it is only needed when you
    # deliberately fetch registry rule packs. Add `semgrep.dev:443` to
    # `allow` in your own copy when you do.
