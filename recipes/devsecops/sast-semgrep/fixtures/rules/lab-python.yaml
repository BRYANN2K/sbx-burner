# Original rules written for sbx-burner (Apache-2.0).
# They are small on purpose: three patterns the eval target plants.
# No rule here is copied or adapted from the Semgrep registry.
rules:
  - id: lab-python-shell-true-user-input
    languages: [python]
    severity: ERROR
    message: >-
      Data from the HTTP request reaches a shell command (shell=True or
      os.system). An attacker can append shell syntax and run commands.
      Pass an argument list without a shell and validate the value.
    metadata:
      cwe: "CWE-78"
      category: security
      confidence: MEDIUM
      licence: Apache-2.0
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.args
          - pattern: flask.request.form
          - pattern: flask.request.values
          - pattern: flask.request.json
          - pattern: flask.request.data
          - pattern: flask.request.headers
          - pattern: flask.request.cookies
          - pattern: flask.request.get_json(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
          - focus-metavariable: $CMD
    pattern-sanitizers:
      - pattern: shlex.quote(...)

  - id: lab-flask-debug-true
    languages: [python]
    severity: WARNING
    message: >-
      Flask runs with debug=True. The Werkzeug debugger gives an interactive
      Python console to anyone who can reach the port. Read the flag from the
      environment and keep it off outside local development.
    metadata:
      cwe: "CWE-489"
      category: security
      confidence: HIGH
      licence: Apache-2.0
    # Reported everywhere except inside test functions (pytest convention).
    pattern-either:
      - patterns:
          - pattern: $APP.run(..., debug=True, ...)
          - pattern-not-inside: |
              def $FUNC(...):
                  ...
      - patterns:
          - pattern: $APP.run(..., debug=True, ...)
          - pattern-inside: |
              def $FUNC(...):
                  ...
          - metavariable-regex:
              metavariable: $FUNC
              regex: "(?!test_).*"

  - id: lab-python-hardcoded-tmp-path
    languages: [python]
    severity: WARNING
    message: >-
      A file is opened for writing at a fixed path under /tmp or /var/tmp.
      Another local user can create that path first (symlink or pre-made
      file). Use tempfile.NamedTemporaryFile or tempfile.mkstemp.
    metadata:
      cwe: "CWE-377"
      category: security
      confidence: MEDIUM
      licence: Apache-2.0
    patterns:
      - pattern: open("$PATH", "$MODE", ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: ^/(tmp|var/tmp)/.+
      - metavariable-regex:
          metavariable: $MODE
          regex: ^[wax]
