schema_version: "1"
name: iac-scan
category: devsecops
scope: none

variants:
  linux:
    status: beta
    kit: kits/devsecops
    image: debian:stable-slim
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 20
  target: required
  # path: a local folder, mounted read-only at /home/agent/target.
  # repo: a git repository cloned on the host with the user's own git login
  # (full history kept, .git/config scrubbed), then mounted like a path.
  targets: [path, repo]
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene]
  network:
    # Nothing is open while the agent runs: trivy uses its embedded
    # checks and checkov runs with --skip-download.
    allow: []
    # The pinned tool downloads (GitHub releases, PyPI for the optional
    # checkov via pipx, Debian apt); closed before the agent starts.
    install_allow:
      - github.com:443
      - release-assets.githubusercontent.com:443
      - objects.githubusercontent.com:443
      - pypi.org:443
      - files.pythonhosted.org:443
      - deb.debian.org:80
      - security.debian.org:80
