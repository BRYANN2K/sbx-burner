schema_version: "1"
name: sbom-sign
category: devsecops
scope: none

variants:
  linux:
    status: beta
    kit: kits/devsecops
    image: debian:stable-slim
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 20
  target: required
  # path = the user's project folder; repo = their repository, cloned on the
  # host and mounted like path; image = their image (host Docker, registry
  # or docker-save tarball) loaded in the sandbox for an image SBOM.
  targets: [path, repo, image]
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene]
  network:
    # Signing is key-based and fully offline: no transparency log, no
    # timestamp authority. Nothing is allowed while the agent runs.
    allow: []
    # Opened for the tools step only; closed before the agent starts.
    install_allow:
      - github.com:443
      - release-assets.githubusercontent.com:443
      - objects.githubusercontent.com:443
      # jq, when the image lacks it.
      - deb.debian.org:80
      - security.debian.org:80
