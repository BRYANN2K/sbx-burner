schema_version: "1"
name: ctf-solver
category: training
scope: required

variants:
  linux:
    status: beta
    kit: kits/lab-tools
    workload: kits/base-kali
    image: kalilinux/kali-rolling
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 45
  # required: the user's challenge handouts via --target, an in-scope
  # challenge URL via --target-url, or the bundled ctf-lab via --demo.
  target: required
  # path: user handouts mounted read-only at /home/agent/target.
  # url: a challenge service the scope file authorizes (never auto-added).
  # demo: the bundled ctf-lab fixtures/ (run.demo builds and starts them).
  targets: [path, url, demo]
  demo: fixtures/demo.sh
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene, scope-discipline]
  network:
    # Nothing the agent needs: challenges are local files or scope hosts.
    # Kali packages are install-only, closed before the agent starts.
    allow: []
    install_allow:
      - http.kali.org:80
      - kali.download:80
