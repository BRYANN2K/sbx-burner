schema_version: "1"
name: vuln-lab
category: training
scope: required

variants:
  linux:
    status: beta
    kit: kits/lab-tools
    workload: kits/base-kali
    image: kalilinux/kali-rolling
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 40
  target: none
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene, scope-discipline]
  network:
    # Nothing the agent needs: the targets are localhost, the images are
    # pulled by tools/install.sh. Everything below is closed before the
    # agent starts.
    allow: []
    install_allow:
      # Kali packages (docker.io, docker-compose) when the CLI is missing.
      - http.kali.org:80
      - kali.download:80
      # Docker Hub pulls: juice-shop, mariadb.
      - registry-1.docker.io:443
      - auth.docker.io:443
      - production.cloudflare.docker.com:443
      # DVWA is published on GitHub Container Registry.
      - ghcr.io:443
      - pkg-containers.githubusercontent.com:443
