# Copy to scope.yaml, set owner and dates, then:
#   python -m lab run training/vuln-lab --scope scope.yaml
schema_version: "1"
id: vuln-lab-local
owner: Your Name
authorization:
  # own-lab: the targets are containers this recipe starts inside the sandbox.
  type: own-lab
valid:
  not_before: "2026-11-01"
  not_after: "2026-12-31"
targets:
  - name: juice-shop
    hosts:
      - localhost:3000
    notes: OWASP Juice Shop from fixtures/compose.yaml
  - name: dvwa
    hosts:
      - localhost:8081
    notes: DVWA from fixtures/compose.yaml, security level low
network:
  # strict: only the hosts in this file, the agent API and the recipe's tool
  # hosts are reachable (needs the global sbx policy set to deny-all).
  mode: strict
  allow: []
  deny: []
techniques:
  allowed: [recon, exploit-poc]
  forbidden: [dos, brute-force, data-exfiltration, social-engineering, data-destruction]
