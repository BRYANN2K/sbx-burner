# Stock Docker Sandboxes environment file for the Linux variant.
# Use it without the lab runner:  sbx env run recipes/training/vuln-lab
# The runner (python -m lab run) adds scope enforcement, evidence and reports.
# `sbx env` is experimental in sbx; the format may change.
# TODO(verify): sbxenv 'agent' with a local workload kit (kits/base-kali)
schemaVersion: "1"
name: lab-vuln-lab
agent: claude
workspace: .
kits:
  - ../../../kits/base-kali
  - ../../../kits/lab-tools
sandboxOptions:
  skills: "off"
