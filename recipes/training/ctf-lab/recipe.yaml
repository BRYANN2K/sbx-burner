schema_version: "1"
name: ctf-lab
category: training
scope: required

variants:
  linux:
    status: beta
    kit: kits/lab-tools
    workload: kits/base-kali
    image: kalilinux/kali-rolling
    sbxenv: sbxenv.yaml
  macos:
    status: planned

run:
  timeout_minutes: 20
  target: none
  snapshot: false
  tools: tools/install.sh
  shared_skills: [evidence-hygiene, scope-discipline]
  network:
    # Nothing the agent needs: the only service is the web challenge on
    # localhost:8081. Kali packages are install-only, closed before the
    # agent starts.
    allow: []
    install_allow:
      - http.kali.org:80
      - kali.download:80
