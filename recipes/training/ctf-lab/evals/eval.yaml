# python -m lab eval training/ctf-lab                  # golden fixture (CI)
# python -m lab eval training/ctf-lab --run runs/<id>  # after a real run
description: >-
  The operator builds the three challenges, shows each one is solvable with
  the checker's verdict, shows the checker rejects a wrong flag, resets to a
  clean state, reports no defect on a healthy lab, and leaks no flag.
fixture: fixtures/golden
checks:
  - type: artifact_absent
    # Raw-file proof no unmasked flag survives in evidence or artifacts.
    pattern: "flag\\{[0-9a-f]{32}\\}"
  - type: tool_ran
    name: build\.sh
  - type: artifact_contains
    path: artifacts/build.log
    pattern: "build ok: 3 challenges"
  - type: artifact_contains
    path: artifacts/solvable.jsonl
    pattern: '"challenge":"web-idor","solved":true,"checker":"OK"'
  - type: artifact_contains
    path: artifacts/solve-web-idor.txt
    # Masking proved on the raw artifact: prefix + 4 hex chars, then stars.
    pattern: "flag\\{[0-9a-f]{4}\\*{4}\\}"
  - type: artifact_contains
    path: artifacts/solve-crypto-xor.txt
    pattern: "(?m)^OK crypto-xor$"
  - type: artifact_contains
    path: artifacts/solve-forensics-meta.txt
    pattern: "(?m)^OK forensics-meta$"
  - type: artifact_contains
    path: artifacts/checker-negative.txt
    pattern: "WRONG web-idor\\s+exit: 1"
  - type: artifact_contains
    path: artifacts/reset.txt
    pattern: "(?m)^reset ok$"
  - type: metric
    name: solvable
    equals: 3
  - type: max_findings
    count: 0
  - type: report_excludes
    # A 32-hex flag in the report means a flag leaked into evidence text.
    pattern: "flag\\{[0-9a-f]{32}\\}"
