# Copy to scope.yaml, set owner and dates, then:
#   python -m lab run training/ctf-lab --scope scope.yaml
schema_version: "1"
id: ctf-lab-local
owner: Your Name
authorization:
  # own-lab: the only target is the web challenge this recipe starts itself.
  type: own-lab
valid:
  not_before: "2026-11-01"
  not_after: "2026-12-31"
targets:
  - name: ctf-web-idor
    hosts:
      - localhost:8081
    notes: The web-idor challenge started by fixtures/serve.sh
network:
  # strict: only the hosts in this file, the agent API and the recipe's tool
  # hosts are reachable (needs the global sbx policy set to deny-all).
  mode: strict
  allow: []
  deny: []
techniques:
  allowed: [ctf, exploit-poc]
  forbidden: [dos, brute-force, social-engineering, data-destruction]
