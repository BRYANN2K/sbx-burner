[project]
name = "sbx-burner"
version = "0.1.0"
description = "Disposable lab recipes for coding agents, run inside Docker Sandboxes (sbx)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# The runner is stdlib-only on purpose: no runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab"]

[tool.setuptools.package-data]
lab = ["schema/*.json", "kit/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["runs", "template/evals", "recipes/*/*/evals/fixtures", "recipes/*/*/fixtures", "proving-ground/**/project"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101",  # assert in tests
  "S603",  # subprocess with a list argv is the whole point of the runner
  "S607",  # sbx is resolved from PATH
  "S106",  # "secret_service" is an sbx service name, not a secret
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
